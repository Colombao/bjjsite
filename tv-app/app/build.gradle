plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.heishikan.tatametv'
    compileSdk 34

    defaultConfig {
        applicationId "br.com.heishikan.tatametv"
        minSdk 21          // cobre praticamente qualquer Android TV / TV Box
        targetSdk 34
        versionCode 11
        versionName "2.0"
    }

    signingConfigs {
        release {
            storeFile rootProject.file('keystore/tatame-tv.jks')
            storePassword 'tatametv123'
            keyAlias 'tatametv'
            keyPassword 'tatametv123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}

plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.heishikan.tatametv'
    compileSdk 34

    defaultConfig {
        applicationId "br.com.heishikan.tatametv"
        minSdk 21          // cobre praticamente qualquer Android TV / TV Box
        targetSdk 34
        versionCode 4
        versionName "1.3"
    }

    buildTypes {
        release {
            minifyEnabled false
            // assinado com a chave de debug: o APK instala direto na TV,
            // sem precisar criar e guardar um keystore próprio
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

dependencies { }
